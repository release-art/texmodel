name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PDM_NON_INTERACTIVE: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: python -m pip install pdm
      - run: pdm install --with dev
      - run: pdm run ruff check src harness tests
      - run: pdm run ruff format --check src harness tests
      - run: pdm run pyright
      - run: pdm run lint-imports
      - run: pdm run pip-audit
      - run: pdm run pytest


  tex:
    # The compile suite (V3) in the reference image plus the TeX packages it lacks (docker/test/Dockerfile), built fresh on
    # the current `latest`. A required gate (plan A3).
    runs-on: ubuntu-latest
    env:
      PDM_NON_INTERACTIVE: 1
      TEXMODEL_REQUIRE_TEX: 1
      TEXMODEL_TEST_IMAGE: texmodel-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: python -m pip install pdm
      - run: pdm install --with dev
      - run: bin/test-image.sh
      - run: pdm run pytest -m tex --no-cov
