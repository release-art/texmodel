name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PDM_NON_INTERACTIVE: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: python -m pip install pdm
      - run: pdm install --with dev
      - run: pdm run ruff check src tests
      - run: pdm run ruff format --check src tests
      - run: pdm run pyright
      - run: pdm run lint-imports
      - run: pdm run pip-audit
      - run: pdm run pytest


  tex:
    # The compile suite (V3) in the reference image. Not yet a gate (continue-on-error): releaseart/lualatex-python has
    # no latexmk until proofpress releases it. Then delete the next line (plan A3). The image is `latest`, pulled fresh.
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      PDM_NON_INTERACTIVE: 1
      TEXMODEL_REQUIRE_TEX: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: python -m pip install pdm
      - run: pdm install --with dev
      - run: docker pull "$(pdm run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['texmodel']['image'])")"
      - run: pdm run pytest -m tex --no-cov
