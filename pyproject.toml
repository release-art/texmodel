[project]
name = "texmodel"
dynamic = ["version"]
description = "Typed document-family models rendered to TeX, with an optional latexmk driver and verifier plugins."
authors = [{name = "Ilja Orlovs", email = "ilja@release.art"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
requires-python = ">=3.15,<3.16"
dependencies = [
    "typer>=0.27.3",
    "pydantic>=2.14.1",
]

[project.optional-dependencies]
proof-pdf = ["proof-pdf>=0.3.3"]

[project.scripts]
texmodel = "texmodel.cli:app"

[project.entry-points."texmodel.run.verifiers"]
proof-pdf = "texmodel.run._internal.proofpdf:ProofPdf"

[project.urls]
Homepage = "https://github.com/release-art/texmodel"
Repository = "https://github.com/release-art/texmodel"

[tool.ruff]
target-version = "py315"
lint.select = ["A", "B", "C", "E", "F", "I", "W", "N", "C4", "T20", "PTH"]
lint.ignore = ["N802"]
line-length = 120

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]

[tool.ruff.lint.isort]
order-by-type = true
combine-as-imports = true
force-wrap-aliases = true
known-first-party = ["texmodel"]
forced-separate = ["tests"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
extraPaths = ["tests/consumers"]
pythonVersion = "3.15"

[tool.texmodel]
prefix = "tm"

[tool.texmodel.run]
image = "releaseart/lualatex-python:latest"

[tool.importlinter]
root_packages = ["texmodel"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "only cli prints and formats"
type = "forbidden"
source_modules = ["texmodel.errors", "texmodel.config"]
forbidden_modules = ["typer", "texmodel.cli"]

[[tool.importlinter.contracts]]
# `spawn` starts processes through asyncio; a test keeps `create_subprocess_*` there (import-linter cannot see a call)
name = "no module imports subprocess"
type = "forbidden"
source_modules = ["texmodel"]
forbidden_modules = ["subprocess"]
allow_indirect_imports = true

# The core never knows the toolchain: `run` sits above every core module, and the command line above both. Exhaustive,
# so a new module of the core fails here until it is listed.
[[tool.importlinter.contracts]]
name = "the core does not know texmodel.run"
type = "layers"
containers = ["texmodel"]
exhaustive = true
layers = [
    "cli",
    "run",
    "_internal : body : bundle : components : config : document : drift : errors : ext : history : interface : keys : keyvals : package : plan : pointer : preamble : restore : spec : std : testing : types",
]

[tool.towncrier]
package = "texmodel"
package_dir = "src"
directory = "changes"
filename = "CHANGELOG.md"
issue_format = ""
start_string = "## [Unreleased]\n"

[tool.mutmut]
paths_to_mutate = ["src/texmodel/"]
tests_dir = ["tests/"]
pytest_add_cli_args = ["--no-cov"]

[tool.pdm]
distribution = true

# The version is the git tag (v1.2.3); no tag falls back to 0.0.0.
[tool.pdm.version]
source = "scm"
tag_regex = '^v(?P<version>\d+\.\d+\.\d+.*)$'
fallback_version = "0.0.0"

[tool.pdm.build]
package-dir = "src"
includes = ["src/texmodel"]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pytest.ini_options]
addopts = "-v -l --color=yes --cov=texmodel --cov-report term-missing --cov-fail-under=100 --no-cov-on-fail"
pythonpath = ["src", "tests/consumers"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# a coroutine never awaited is a test that checked nothing (`assert not compile(...)` holds for a coroutine)
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
timeout = 15
markers = [
    "tex: needs the reference image with latexmk (skipped without it; TEXMODEL_REQUIRE_TEX=1 makes that a failure)",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.1",
    "pyright>=1.1.414",
    "import-linter>=2.0",
    "pip-audit>=2.7",
    "towncrier>=24.8",
    "mutmut>=3.0",
    "proof-pdf>=0.3.3",
    "hypothesis>=6",
    "jsonschema>=4",
    "pytest-asyncio>=1.4.1",
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocs<2",  # Material 9 targets MkDocs 1.x; 2.0 drops plugins and theme overrides
]
